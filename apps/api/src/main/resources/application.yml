server:
  port: ${SERVER_PORT:7001}
  shutdown: graceful

spring:
  application:
    name: irm-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  devtools:
    restart:
      trigger-file: .reloadtrigger

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

irm:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 3h
    reset-reference-ttl: ${RESET_REFERENCE_TTL:30m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    start-tls: ${SMTP_STARTTLS:true}
    locale: ${MAIL_LOCALE:en-NZ}

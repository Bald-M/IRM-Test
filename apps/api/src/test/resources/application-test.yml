spring:
  datasource:
    url: jdbc:h2:mem:irm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

irm:
  jwt:
    secret: test-only-jwt-secret-that-is-at-least-thirty-two-bytes-long
    ttl: 3h
  mail:
    enabled: false
